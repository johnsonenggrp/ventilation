<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#426170"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Vent Sizing"><link rel="apple-touch-icon" href="Sizing_icon.png">
<meta name="description" content="Ventilation sizing for existing and proposed swine sites &mdash; Johnson Engineering Group.">
<title>Ventilation Sizing &mdash; Johnson Engineering Group</title>
<style>
/* ===== base structure shared by all three views =====
   JEG brand design system (mirrored from design-system/jeg-design-system.css):
   slate #426170 is the dominant structural color, blue #36BAF2 is the accent. */
:root{
  --jeg-blue:#36BAF2; --jeg-slate:#426170;
  --bg:#f4f6f8; --panel:#ffffff; --ink:#2b3b43; --muted:#6b7785; --line:#d7dee3;
  --brand:#426170; --brand-d:#31474f; --brand-50:#eef2f3;
  --accent:#36BAF2; --accent-50:#eaf7fd; --accent-700:#1f8bc2;
  --in-bg:#f2f8fc; --in-line:#cdd9e0;       /* editable input cells */
  --out-bg:#f6f8fa;
  --ok:#1a8f4c; --ok-bg:#e6f6ec; --bad:#c0392b; --bad-bg:#fdecea; --na:#9aa6b2;
  --warn:#b9770b;
  --radius:10px; --shadow:0 1px 3px rgba(42,59,67,.10),0 6px 18px rgba(42,59,67,.05);
  --mono:"SFMono-Regular",ui-monospace,"Cascadia Mono","Consolas",monospace;
  --font-heading:"Century Gothic","Futura","Segoe UI Semibold","Trebuchet MS",sans-serif;
  --font-body:Arial,"Segoe UI",Helvetica,sans-serif;
  --sans:var(--font-body);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.vent-app{max-width:1500px;margin:0 auto;padding:0 18px 60px}
h1,h2,h3{margin:0;font-weight:650;font-family:var(--font-heading)}
em{font-style:italic;color:var(--muted)}

/* branded app bar (full-bleed slate) */
.appbar{background:var(--brand);color:#fff;margin:0 -18px 18px;padding:14px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(42,59,67,.18)}
.appbar .brand-id{display:flex;align-items:center;gap:13px;min-width:0}
.appbar .wordmark{font-family:var(--font-heading);font-weight:700;letter-spacing:.06em;font-size:13px;line-height:1.15;white-space:nowrap}
.appbar .wordmark .j{color:var(--jeg-blue)}
.appbar .wordmark .e{color:#fff;opacity:.92}
.appbar .divider{width:1px;height:34px;background:rgba(255,255,255,.28)}
.appbar .app-title{font-family:var(--font-heading);font-weight:700;font-size:19px;letter-spacing:.01em;color:#fff;min-width:0}
.appbar .app-title small{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;opacity:.8;letter-spacing:.02em;margin-top:1px}
.appbar .config-tools .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}
.appbar .config-tools .btn:hover{background:rgba(255,255,255,.2);border-color:#fff}
.appbar .config-tools .btn.danger{color:#ffd9d4;border-color:rgba(255,160,150,.5)}
.appbar .config-tools .btn.danger:hover{background:rgba(192,57,43,.35);border-color:#ffb0a8}

.app-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:14px 0 16px}
.app-head h1{font-size:22px;letter-spacing:-.2px}
.app-head .sub{margin:.35em 0 0;color:var(--muted);max-width:820px}
.badge{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:700;
  padding:2px 9px;border-radius:999px;vertical-align:middle;letter-spacing:.5px}
.app-sub{color:var(--muted);font-size:13px;max-width:900px;margin:0 0 16px;line-height:1.5}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.panel-h{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}

/* fields */
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px}
.fld .fl{color:var(--muted);font-weight:600}
.fld input,.fld select,.eq-row input,.eq-row select{
  font-family:inherit;font-size:13px;color:var(--ink);background:var(--in-bg);
  border:1px solid var(--in-line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.eq-row input:focus,.eq-row select:focus{
  outline:2px solid var(--brand);outline-offset:-1px;background:#fff}
.ig{display:flex;align-items:center;gap:6px}
.ig .unit{color:var(--muted);font-size:11px;white-space:nowrap}

.building-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fan-factor{justify-content:flex-end}
.ff-val{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent)}

.sp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:780px){.sp-grid{grid-template-columns:repeat(2,1fr)}}

/* barn type tabs (level 1) */
.barn-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0;border-bottom:2px solid var(--line)}
.barn-tab{font:inherit;font-size:14.5px;font-weight:650;color:var(--muted);background:transparent;
  border:1px solid transparent;border-bottom:none;padding:10px 22px;border-radius:9px 9px 0 0;cursor:pointer;position:relative;top:2px}
.barn-tab:hover{color:var(--ink);background:#eef4fa}
.barn-tab.active{color:var(--brand-d);background:var(--panel);border-color:var(--line);border-bottom:2px solid var(--panel);box-shadow:inset 0 3px 0 var(--accent),0 -2px 6px rgba(42,59,67,.05)}
.barn-tab .tcount{font-size:11px;font-weight:700;color:#fff;background:var(--muted);border-radius:999px;padding:1px 7px;margin-left:7px}
.barn-tab.active .tcount{background:var(--accent)}

/* barn instance bar (level 2) */
.instance-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.inst-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inst-pill{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);
  padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.inst-pill:hover{border-color:var(--brand)}
.inst-pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.inst-add{border-style:dashed;color:var(--brand);font-weight:700}
.inst-add:hover{background:#eef4fa}
.inst-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.inst-tools .nm{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--in-line);background:var(--in-bg);border-radius:6px;width:170px}
.inst-tools .copy-sel{width:auto;max-width:230px;color:var(--brand);font-weight:600;cursor:pointer}
.btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
.btn:hover{background:#eef4fa;border-color:var(--brand)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
.empty-barn{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
.config-tools{display:flex;gap:8px;align-items:center}

.scenario{display:flex;flex-direction:column;margin-bottom:26px}
.scenario-head{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.scenario-head h2{font-size:18px}
.scenario-head::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--brand)}
.scenario-proposed .scenario-head::before{background:var(--accent)}

/* read-only cells (manager reviews the tech's Existing record) */
.ro-val{font-size:13px;color:var(--ink);padding:3px 2px;word-break:break-word;line-height:1.3}
.cond-ro{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.cond-ro.cond-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cond-ro.cond-repair{background:#fbf3e3;border-color:#e0b36a;color:var(--warn)}
.cond-ro.cond-broken{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cond-ro.cond-none{border-style:dashed;color:var(--muted)}
.pthumb-ro{width:30px;height:30px;border-radius:5px;object-fit:cover;border:1px solid var(--line);margin-left:6px;flex:0 0 auto}
.scenario.locked .cat-h,.scenario.locked .panel-h{color:var(--muted)}
.scn-note{font-size:11px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.building-panel.locked input:disabled,.building-panel.locked select:disabled{background:#eef2f6;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);cursor:default}

/* recommend button on the proposed scenario */
.btn-recommend{margin-left:auto;font-family:var(--font-heading);font-weight:700;font-size:13px;color:#fff;background:var(--accent);border:none;border-radius:8px;padding:7px 14px;cursor:pointer}
.btn-recommend:hover{background:var(--accent-700)}

/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{background:var(--out-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.m-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.m-line{display:flex;align-items:baseline;gap:5px;margin-top:3px}
.m-val{font-family:var(--mono);font-size:21px;font-weight:700;color:var(--ink)}
.m-unit{font-size:11px;color:var(--muted)}
.m-sub{font-size:11px;font-weight:600;margin-top:2px;display:inline-block}
.range-ok{color:var(--ok)}.range-low{color:var(--warn)}.range-high{color:var(--bad)}.range-na{color:var(--na)}

.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:12px;background:#fff}
.chip-label{color:var(--muted);font-weight:600}
.chip-status{font-weight:700}
.chip.ok{background:var(--ok-bg);border-color:var(--ok)}.chip.ok .chip-status{color:var(--ok)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad)}.chip.bad .chip-status{color:var(--bad)}
.chip.na .chip-status{color:var(--na)}

/* equipment tables */
.cat-h{font-size:13px;font-weight:700;color:var(--brand-d);margin-bottom:2px}
.cat-hint{font-size:11.5px;color:var(--muted);margin:0 0 8px;font-style:italic}
.eq-table{display:flex;flex-direction:column;gap:0}
.eq-row{display:grid;align-items:stretch}
.eq-row .cell{padding:3px;display:flex;align-items:center}
.eq-row.eq-head .cell{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.3px;padding:4px 3px;border-bottom:1px solid var(--line)}
.out-cell{justify-content:flex-end}
.out-cell b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.eq-head .out-cell{justify-content:flex-end}

/* per-category column templates (table layouts) */
.cat-fan .eq-row{grid-template-columns:2.4fr .6fr .6fr 1.4fr .9fr .9fr .9fr .9fr 1fr}
.cat-inlet .eq-row{grid-template-columns:2.6fr .8fr 1.5fr 1fr 1.1fr}
.cat-inletFilter .eq-row{grid-template-columns:2.2fr .7fr .8fr .8fr 1.5fr .9fr .8fr .9fr 1fr}
.cat-coolCell .eq-row{grid-template-columns:2.2fr .9fr .9fr 1.5fr .9fr .8fr 1.1fr}
.cat-filter .eq-row{grid-template-columns:2.2fr .7fr .8fr .8fr 1.5fr .9fr .8fr .9fr 1fr}
.cat-soffit .eq-row{grid-template-columns:1.3fr .9fr .9fr 1.5fr 1fr .9fr .9fr 1.1fr}
.cat-shutter .eq-row{grid-template-columns:.9fr .9fr .9fr 1.5fr .9fr .9fr 1.1fr}

/* tag/model search pick widget (type what's on the equipment tag) */
.pick-cell{overflow:visible}
.pickbox{position:relative;display:flex;align-items:center;width:100%}
.pickinput{width:100%;padding-right:22px!important}
.pickclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:none;background:transparent;
  color:var(--muted);font-size:13px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:4px}
.pickclear:hover{background:var(--line);color:var(--ink)}
.pickmenu{position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:40;display:none;
  max-height:240px;overflow-y:auto;background:#fff;border:1px solid var(--brand);border-radius:8px;
  box-shadow:0 8px 24px rgba(20,40,60,.18)}
.pickmenu.open{display:block}
.pickitem{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #eef2f5;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pickitem:last-child{border-bottom:none}
.pickitem:hover{background:#e8f6fd}
.pickitem.pick-none{color:var(--muted);cursor:default;font-style:italic}
.pickitem.pick-none:hover{background:transparent}

/* condition + photo cell */
.cond-cell{overflow:visible}
.condwrap{display:flex;align-items:center;gap:5px;width:100%}
.condsel{flex:1 1 auto;min-width:0}
.condsel.cond-ok{border-color:var(--ok)!important;color:var(--ok);font-weight:600}
.condsel.cond-repair{border-color:#e0b36a!important;color:var(--warn);font-weight:600}
.condsel.cond-broken{border-color:var(--bad)!important;color:var(--bad);font-weight:600}
.photobtn{flex:0 0 auto;width:30px;height:30px;padding:0;border:1px solid var(--line);background:#fff;
  border-radius:7px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photobtn:hover{border-color:var(--accent)}
.pthumb{width:100%;height:100%;object-fit:cover;display:block}

/* keep the wider audit rows usable on tablets */
@media(max-width:900px){.cat{overflow-x:auto;-webkit-overflow-scrolling:touch}.eq-table{min-width:700px}}
/* phones: stack each equipment row into a labelled card (labels come from data-label) */
@media(max-width:640px){
  .cat{overflow-x:visible}
  .eq-table{min-width:0;display:flex;flex-direction:column;gap:9px}
  .eq-row.eq-head{display:none}
  .eq-row{display:block;border:1px solid var(--line);border-radius:10px;padding:3px 11px;background:#fff}
  .eq-row .cell{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed #eef2f5;min-height:30px}
  .eq-row .cell:last-child{border-bottom:none}
  .eq-row .cell::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .eq-row .cell>input,.eq-row .cell>select{flex:0 0 auto;max-width:58%;text-align:right}
  .eq-row .out-cell b{font-size:14px}
  .eq-row .ro-val{text-align:right}
  .eq-row .cell.pick-cell,.eq-row .cell.cond-cell{display:block}
  .eq-row .cell.pick-cell::before,.eq-row .cell.cond-cell::before{display:block;margin-bottom:6px}
  .eq-row .pickbox{width:100%}
  .eq-row .condwrap{width:100%;justify-content:flex-start}
}

.cat-foot{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;padding-top:8px;border-top:2px solid var(--line)}
.cat-total{display:flex;flex-direction:column}
.ct-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.ct-line{display:flex;align-items:baseline;gap:4px}
.ct-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent-700)}
.ct-unit{font-size:10px;color:var(--muted)}

.app-foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.view-switch{display:flex;gap:6px}
.view-switch a{font-size:12px;font-weight:600;text-decoration:none;color:var(--brand);
  border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:7px}
.view-switch a.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* recommend sizing: how it was sized + anything that didn't fit */
.rec-notes{position:relative;background:#eef8fe;border:1px solid #b9e2f6;border-left:4px solid var(--accent);border-radius:9px;padding:11px 38px 11px 15px;margin:0 0 4px;font-size:13px;line-height:1.5;color:var(--ink)}
.rec-notes h4{margin:0 0 5px;font-family:var(--font-heading);font-size:13px;color:var(--brand-d)}
.rec-notes ul{margin:0;padding-left:18px}
.rec-notes li{margin:2px 0}
.rec-notes li.rn-warn{color:var(--warn);font-weight:600}
.rec-notes .rn-x{position:absolute;top:7px;right:9px;background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 6px;border-radius:5px}
.rec-notes .rn-x:hover{background:rgba(0,0,0,.07);color:var(--ink)}

/* report: "(calculated)" / "(entered)" tag after a pressure */
.pmode{font-size:.85em;color:#6b7785;font-weight:400}

/* fan pressure boxes (calculated / entered), the fan-pressure warning, the second line under fan and inlet rows, and the Opening Coeff. check */
.sp-fan-body{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:34px}
.sp-fan-body input{width:84px}
.sp-val{font-family:var(--mono);font-size:15px;color:var(--ink)}
.sp-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-700);background:var(--accent-50);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}
.sp-link{background:none;border:0;padding:0;font:inherit;font-size:11.5px;font-weight:700;color:var(--accent-700);text-decoration:underline;cursor:pointer}
.sp-note{margin:8px 0 0;font-size:12px;color:var(--muted)}
.sp-warn{margin-top:8px;padding:8px 11px;border:1px solid #e0b36a;border-left:4px solid #e0b36a;background:#fbf3e3;border-radius:8px;font-size:12.5px;line-height:1.45;color:#6f520f;font-weight:600}
.sp-warn[hidden]{display:none}
.eq-sub{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:0 6px 6px;font-size:11.5px;color:var(--muted)}
.eq-ov{display:inline-flex;align-items:center;gap:6px}
.eq-ov input{width:92px;padding:4px 7px}
.eq-notes{display:inline-flex;flex-wrap:wrap;gap:4px 12px}
.eq-note.plain{color:var(--muted);font-weight:500}
.eq-note.warn{color:var(--warn);font-weight:600}
.eq-note.bad{color:var(--bad);font-weight:700}
.eq-note.info{color:var(--accent-700);font-weight:600}
.fld-err{font-size:11px;color:var(--bad);min-height:13px}
.bad-in{border-color:var(--bad)!important}
/* static pressure boxes: the "Use 0 to 1 in." message takes no room until a value is refused (on the fan box it wraps onto its own line) */
.sp-grid .fld-err,.sp-fan-body .fld-err{min-height:0}
.sp-grid .fld-err:empty,.sp-fan-body .fld-err:empty{display:none}
.sp-fan-body .fld-err{flex-basis:100%}

/* ===== HYBRID: spreadsheet-style entry tables (full width, stacked) + polished dashboard ===== */
.layout-hybrid .dashboard{order:-1;border-left:4px solid var(--brand)}
.layout-hybrid .scenario-proposed .dashboard{border-left-color:var(--accent)}
.layout-hybrid .scenario{gap:14px}

/* prominent results */
.layout-hybrid .dash-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px}
.layout-hybrid .m-val{font-size:22px}
.layout-hybrid .metric{background:#fff;box-shadow:var(--shadow)}

/* full-width category tables, stacked vertically, zebra striped */
.layout-hybrid .cats{display:flex;flex-direction:column;gap:14px}
.layout-hybrid .cat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:14px 16px}
.layout-hybrid .cat-h{font-size:14px;margin-bottom:8px}
.layout-hybrid .eq-row{border-radius:6px}
.layout-hybrid .eq-row:not(.eq-head):nth-child(even){background:#fafbfd}
.layout-hybrid .eq-row:not(.eq-head):hover{background:#f0f6fc}
.layout-hybrid .eq-row .cell{padding:4px}
.layout-hybrid .out-cell b{font-size:13px;color:var(--brand-d)}
.layout-hybrid .cat-foot{justify-content:flex-start;gap:22px}

/* keep tables readable on narrow screens */
@media(max-width:900px){
  .layout-hybrid .eq-row{grid-template-columns:1fr 1fr!important;gap:6px}
  .layout-hybrid .eq-head{display:none}
  .layout-hybrid .eq-row .cell{flex-direction:column;align-items:stretch;gap:2px}
  .layout-hybrid .eq-row .cell::before{content:attr(data-label);font-size:10px;color:var(--muted);font-weight:700}
  .layout-hybrid .eq-row:not(.eq-head){border:1px solid var(--line);padding:10px;margin-bottom:6px}
}

/* ===== product shell (sign-in · workspace · calculator chrome) ===== */
.shell{min-height:100vh}

/* top nav */
.nav{background:var(--brand);color:#fff;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(42,59,67,.18);position:sticky;top:0;z-index:20}
.nav-left,.nav-right{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.nav .wordmark{font-family:var(--font-heading);font-weight:700;letter-spacing:.06em;font-size:13px;white-space:nowrap}
.nav .wordmark .j{color:var(--jeg-blue)}
.nav-back{font-family:var(--font-heading);font-weight:700;font-size:13px;color:#fff;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:6px 12px;cursor:pointer}
.nav-back:hover{background:rgba(255,255,255,.2)}
.proj-name-input{font-family:var(--font-heading);font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:6px 11px;min-width:150px;max-width:260px}
.proj-name-input:focus{outline:none;background:rgba(255,255,255,.16);border-color:#fff}
.nav .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}
.nav .btn:hover{background:rgba(255,255,255,.2);border-color:#fff}
.nav .btn.danger{color:#ffd9d4;border-color:rgba(255,160,150,.5)}
.nav .btn.danger:hover{background:rgba(192,57,43,.35);border-color:#ffb0a8}

/* user menu */
.user-menu{position:relative}
.um-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
  border-radius:999px;padding:4px 10px 4px 4px;color:#fff;font-family:var(--font-body);font-size:13px;cursor:pointer}
.um-btn:hover{background:rgba(255,255,255,.16)}
.um-avatar{width:26px;height:26px;border-radius:50%;background:var(--jeg-blue);color:#0a2a3a;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:13px}
.um-email{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.um-caret{opacity:.8;font-size:11px}
.um-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:9px;
  box-shadow:0 8px 28px rgba(42,59,67,.18);min-width:150px;padding:6px;display:none;z-index:30}
.user-menu.open .um-pop{display:block}
.um-item{display:block;width:100%;text-align:left;background:none;border:none;font-family:var(--font-body);font-size:13.5px;
  color:var(--ink);padding:9px 11px;border-radius:6px;cursor:pointer}
.um-item:hover{background:var(--brand-50)}

/* sign-in */
.signin-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 55%,#20303a 100%)}
.signin-card{background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.28);padding:34px 32px;width:100%;
  max-width:384px;display:flex;flex-direction:column;gap:12px}
.si-brand .wordmark{font-family:var(--font-heading);font-weight:700;letter-spacing:.06em;font-size:12px;color:var(--ink)}
.si-brand .wordmark .j{color:var(--jeg-blue)}
.si-logo{height:42px;width:auto;display:block;margin-bottom:2px}
.si-title{font-size:24px;color:var(--brand);margin:6px 0 0}
.si-sub{color:var(--muted);margin:0 0 6px;font-size:14px}
.si-input{font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#f7fafc;color:var(--ink)}
.si-input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.si-btn{font-family:var(--font-heading);font-weight:700;font-size:15px;color:#fff;background:var(--accent);border:none;border-radius:9px;padding:13px;cursor:pointer;margin-top:4px}
.si-btn:hover{background:var(--accent-700)}
.si-demo{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0;line-height:1.5}

/* workspace */
.ws{max-width:1100px;margin:0 auto;padding:28px 22px 60px}
.ws-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ws-title{font-size:26px;color:var(--brand);margin:0}
.ws-sub{color:var(--muted);margin:5px 0 0;font-size:14px}
.btn-primary{font-family:var(--font-heading);font-weight:700;font-size:14px;color:#fff;background:var(--accent);
  border:none;border-radius:9px;padding:11px 18px;cursor:pointer;white-space:nowrap}
.btn-primary:hover{background:var(--accent-700)}
.ws-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-ghost{font-family:var(--font-heading);font-weight:700;font-size:13.5px;color:var(--brand);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 16px;cursor:pointer}
.btn-ghost:hover{background:var(--brand-50);border-color:var(--brand)}
.ws-empty .btn-ghost{margin-top:10px;border:none;background:none;color:var(--accent-700);text-decoration:underline;padding:6px}
.ws-empty{text-align:center;padding:60px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
.we-icon{font-size:38px;margin-bottom:8px}
.ws-empty p{margin:0 0 16px;font-size:15px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.proj-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.proj-card:hover{box-shadow:0 6px 22px rgba(42,59,67,.14);transform:translateY(-1px)}
.pc-body{padding:18px 18px 12px}
.pc-name{font-size:17px;color:var(--brand);margin:0 0 3px}
.pc-client{color:var(--muted);font-size:13px;margin:0 0 12px;min-height:1em}
.pc-meta{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.pc-actions{display:flex;align-items:center;gap:8px;padding:11px 15px;border-top:1px solid var(--line);background:#fbfcfd;margin-top:auto}
.pc-open{padding:8px 16px;font-size:13px}
.pc-menu{display:flex;gap:3px;margin-left:auto}
.btn-icon{font-family:var(--font-body);font-size:12px;color:var(--muted);background:none;border:1px solid transparent;
  border-radius:6px;padding:6px 9px;cursor:pointer}
.btn-icon:hover{background:var(--brand-50);color:var(--ink)}
.btn-icon.danger:hover{background:var(--bad-bg);color:var(--bad)}

.nav .btn.btn-report{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.nav .btn.btn-report:hover{background:var(--accent-700);border-color:var(--accent-700)}

/* project details (report header fields) */
.proj-details{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;padding:14px 18px 0}
.pd-field{display:flex;flex-direction:column;gap:3px;font-size:12px}
.pd-l{color:var(--muted);font-weight:600}
.pd-in{font-family:var(--font-body);font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:150px}
.pd-in:focus{outline:2px solid var(--accent);outline-offset:-1px}
.audit-prog{margin-left:auto;align-self:flex-end;margin-bottom:2px;font-size:12.5px;color:var(--ink);background:#eef1f3;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.audit-prog b{color:var(--brand)}
.audit-prog.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.audit-prog.done b{color:var(--ok)}
.audit-prog.warn{background:#fbf3e3;border-color:#e9cf9b;color:var(--warn)}
.audit-prog.warn b{color:var(--warn)}
@media(max-width:640px){.audit-prog{margin-left:0;align-self:flex-start}}

/* embedded calculator */
.shell .vent-app{padding-top:14px}
.calc-foot{max-width:1500px;margin:0 auto;color:var(--muted);font-size:12px;padding:16px 18px 40px;line-height:1.5}

/* ===== printable report ===== */
#printArea{display:none}
.rpt-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:2px solid var(--brand);padding-bottom:8px;margin-bottom:12px}
.rpt-word{font-family:var(--font-heading);font-weight:700;letter-spacing:.05em;font-size:15px;color:var(--brand)}
.rpt-word .j{color:var(--accent-700)}
.rpt-title{font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--ink)}
.rpt-meta{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
.rpt-meta th{text-align:left;color:var(--muted);font-weight:700;font-family:var(--font-heading);padding:3px 8px 3px 0;white-space:nowrap;vertical-align:top;width:12%}
.rpt-meta td{padding:3px 16px 3px 0;color:var(--ink);width:25%}
.pbarn{margin-bottom:16px;page-break-inside:avoid}
.pbarn h2{font-family:var(--font-heading);font-size:15px;color:var(--brand);margin:14px 0 3px;border-bottom:1px solid var(--line);padding-bottom:3px}
.pbadge{font-size:10px;font-weight:700;color:var(--accent-700);border:1px solid var(--accent);border-radius:999px;padding:1px 7px;vertical-align:middle;margin-left:6px}
.pbuild{font-size:12px;color:#333;margin:0 0 8px}
table.ptab{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 10px}
table.ptab th,table.ptab td{border:1px solid #9aa6b0;padding:4px 7px;text-align:left;vertical-align:top}
table.ptab thead th{background:#e8eef4;color:var(--brand-d);font-family:var(--font-heading);font-weight:700}
table.ptab td.lcol,table.ptab th.lcol{width:30%;white-space:nowrap}
.rok{color:var(--ok);font-weight:700}
.rflag{color:var(--bad);font-weight:700}
.rnone{color:var(--muted)}
.pmissing{font-size:11px;color:#555;margin:-4px 0 9px;font-style:italic}
.rpt-foot{font-size:10.5px;color:#555;margin-top:14px;border-top:1px solid var(--line);padding-top:8px;line-height:1.5}
.rpt-logo{height:46px;width:auto}
.rpt-empty{color:var(--muted);font-size:14px;padding:20px 0}
.pverdict{font-size:13px;font-weight:700;padding:7px 12px;border-radius:7px;margin:2px 0 9px;border:1px solid}
.pverdict.v-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pverdict.v-bad{background:#fbf3e3;border-color:#e0b36a;color:var(--warn)}
.pverdict.v-na{background:#f0f2f4;border-color:var(--line);color:var(--muted)}
.prepair{font-size:12px;font-weight:700;color:var(--warn);background:#fbf3e3;border:1px solid #e0b36a;border-radius:7px;padding:5px 11px;margin:-4px 0 9px}
table.pcond td.lcol{white-space:normal}
.cpill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid}
.cpill.cok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cpill.crepair{background:#fbf3e3;border-color:#e0b36a;color:var(--warn)}
.cpill.cbroken{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pphoto{max-width:120px;max-height:90px;border-radius:5px;border:1px solid var(--line);display:block}
.rpt-sign{display:flex;gap:28px;align-items:flex-end;margin-top:26px;page-break-inside:avoid}
.sig-col{flex:1;max-width:280px}
.sig-line{border-bottom:1px solid #333;height:36px}
.sig-cap{font-size:11px;color:#333;margin-top:3px}
.sig-seal{width:104px;height:104px;border:1px dashed #9aa6b0;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#9aa6b0;font-family:var(--font-heading);font-weight:700;line-height:1.3}

@media print{
  .nav,.vent-app,.calc-foot,.proj-details,.signin-page,.ws,.app-sub,.appbar{display:none !important}
  html,body,.shell{background:#fff !important}
  #printArea{display:block;max-width:none;padding:0}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  .pbarn{page-break-before:always}
  .pbarn:first-of-type{page-break-before:avoid}
  @page{margin:0.6in}
}

/* ===== role-based additions ===== */
/* sign-in role picker */
.si-flabel{font-size:12px;color:var(--muted);font-weight:600;margin:4px 0 -4px}
.si-roles{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.si-role{flex:1;font-family:var(--font-heading);font-weight:700;font-size:14px;padding:11px;border:none;background:#fff;color:var(--muted);cursor:pointer}
.si-role.active{background:var(--brand);color:#fff}

/* user menu role label */
.um-who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.12}
.um-role{font-size:10px;opacity:.78;text-transform:uppercase;letter-spacing:.04em}

/* status dot + card status */
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot-ok{background:var(--ok)}.dot-bad{background:var(--bad)}.dot-na{background:var(--na)}
.pc-status{display:flex;align-items:center;gap:7px;margin:0 0 10px;font-size:13px}
.pc-stext{font-weight:600;color:var(--ink)}

/* per-barn status banner in the audit */
.barn-status{max-width:1500px;margin:0 auto 16px;padding:11px 16px;border-radius:9px;font-size:14px;border:1px solid}
.barn-status.s-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.barn-status.s-bad{background:#fbf3e3;border-color:#e0b36a;color:var(--warn)}
.barn-status.s-na{background:#f0f2f4;border-color:var(--line);color:var(--muted)}
.bs-missing{font-weight:600;opacity:.72;font-size:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--brand-d);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.3s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* manager dashboard */
.dash-top{margin-bottom:18px}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 20px;min-width:120px;display:flex;flex-direction:column}
.kpi .k-n{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--brand)}
.kpi .k-l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.kpi.k-bad .k-n{color:var(--bad)}
.dash-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fchip{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer}
.fchip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.dash-tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:auto}
.dash-table{width:100%;border-collapse:collapse;font-size:13.5px}
.dash-table th{background:var(--brand-50);color:var(--ink);text-align:left;font-family:var(--font-heading);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:11px 14px;white-space:nowrap}
.dash-table td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
.dash-table tbody tr{cursor:pointer}
.dash-table tbody tr:hover{background:var(--brand-50)}
.dt-name{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dt-name b{color:var(--brand)}
.draft{font-size:10px;font-weight:700;color:var(--muted);background:#eef1f3;border-radius:4px;padding:1px 6px;text-transform:uppercase}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill-bad{background:var(--bad-bg);color:var(--bad)}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-na{background:#eef1f3;color:var(--muted)}
.dt-by{color:var(--muted)}
.dt-act .btn-icon{color:var(--accent-700);font-weight:700;white-space:nowrap}

/* manager on-screen report view */
.report-view{max-width:880px;margin:18px auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:30px 36px}

/* manager site review (editable proposed) */
.mgr-site-title{font-family:var(--font-heading);font-weight:700;color:#fff;font-size:15px;padding:4px 11px;background:rgba(255,255,255,.14);border-radius:7px}
.mgr-intro{max-width:1500px;margin:14px auto 2px;padding:12px 18px;background:var(--brand-50);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink);line-height:1.55}
.mgr-intro b{color:var(--brand)}

/* repairs signalling (amber) */
.dot-warn{background:#e0a84a}
.kpi.k-warn .k-n{color:var(--warn)}
.pill-rep{background:#fbf3e3;color:var(--warn);border:1px solid #e9cf9b}

/* ---------- site setup page ---------- */
.setup-wrap{max-width:620px;margin:22px auto;padding:0 18px}
.setup-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 28px}
.setup-title{font-size:23px;color:var(--brand);margin:0}
.setup-sub{color:var(--muted);font-size:14px;margin:5px 0 18px;line-height:1.5}
.setup-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.su-field{display:flex;flex-direction:column;gap:4px}
.su-field:first-child{grid-column:1 / -1}
.su-l{font-size:12px;color:var(--muted);font-weight:600}
.su-in{font-family:var(--font-body);font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#f7fafc;color:var(--ink)}
.su-in:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.setup-h2{font-family:var(--font-heading);font-size:15px;color:var(--brand);margin:22px 0 2px;border-top:1px solid var(--line);padding-top:16px}
.setup-hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.su-steppers{display:flex;flex-direction:column;gap:8px}
.su-step{display:flex;align-items:center;justify-content:space-between;background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.su-tname{font-weight:600;color:var(--ink);font-size:14.5px}
.su-ctrl{display:flex;align-items:center;gap:4px}
.su-step-btn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:19px;font-weight:700;color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.su-step-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.su-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);min-width:30px;text-align:center}
.su-totalrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.su-tl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.su-total{font-family:var(--font-heading);font-weight:700;color:var(--brand);font-size:15px}
.setup-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:560px){.setup-fields{grid-template-columns:1fr}.su-field:first-child{grid-column:auto}}

/* ===== personal build additions (single role · dashboard tabs · site type) — layered on shell.css ===== */

/* dashboard header: title + the Add-site button live together */
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.dash-head .ws-sub{margin-top:4px}
.dash-top{margin-bottom:20px}

/* All / Current / Past tabs */
.dtabs{display:flex;gap:4px;box-shadow:inset 0 -2px 0 var(--line);margin:4px 0 14px;overflow-x:auto;overflow-y:hidden}
.dtab{font-family:var(--font-heading);font-weight:700;font-size:14px;color:var(--muted);background:none;border:none;
  border-bottom:3px solid transparent;padding:11px 18px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.dtab:hover{color:var(--brand)}
.dtab.active{color:var(--brand);border-bottom-color:var(--accent)}
.dtab .tn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);background:#eef1f3;border-radius:999px;padding:1px 9px}
.dtab.active .tn{background:var(--accent);color:#fff}

/* site-type badge (Existing / Proposed) */
.tbadge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:2px 8px;border:1px solid;white-space:nowrap}
.tbadge.t-existing{color:var(--brand);background:var(--brand-50);border-color:#c4d2db}
.tbadge.t-proposed{color:var(--accent-700);background:#e8f6fd;border-color:var(--accent)}
.draft.is-past{background:#e3e8ec;color:#5b6b75}

/* dashboard table: row actions */

.dt-acts .btn-icon.open{color:var(--accent-700);background:var(--accent-50);border-color:var(--accent);font-weight:700}
.dt-acts .btn-icon.open:hover{background:#d6eefa;color:var(--accent-700)}
.dt-acts .btn-icon.sync-act{color:#fff;background:var(--accent-700);border-color:var(--accent-700);font-weight:700}
.dt-acts .btn-icon.sync-act:hover{background:#17709c;border-color:#17709c;color:#fff}
.dt-acts .btn-icon.danger{color:var(--bad);border-color:#e9c4bf}
.dt-acts .btn-icon.danger:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

.dash-table td.dt-name{display:table-cell}
.dash-table td.dt-name .sdot{margin-right:8px;vertical-align:middle}
.dash-table td.dt-name b,.dash-table td.dt-name .draft{vertical-align:middle}
.dash-table td.dt-name .draft{margin-left:8px}
.dash-table tr.is-past .dt-name b{color:#5b6b75}
.dash-table tr.is-past{opacity:.86}

/* site setup: Existing vs Proposed choice */
.su-types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 20px}
.su-type{text-align:left;font-family:var(--font-body);background:#f7fafc;border:2px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.su-type:hover{border-color:#b9c9d3}
.su-type.active{border-color:var(--accent);background:#eef8fe;box-shadow:0 0 0 3px rgba(54,186,242,.15)}
.su-type .st-t{font-family:var(--font-heading);font-weight:700;font-size:15px;color:var(--brand)}
.su-type .st-d{font-size:12.5px;color:var(--muted);line-height:1.4}
.su-type.active .st-t{color:var(--brand-d)}
.su-q{font-family:var(--font-heading);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:0 0 8px}

.pd-sel{font-family:var(--font-body);font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:150px}
.pd-sel:focus{outline:2px solid var(--accent);outline-offset:-1px}
.site-state{align-self:flex-end;margin-bottom:2px;font-size:12px;font-weight:700;border-radius:999px;padding:6px 13px;border:1px solid;white-space:nowrap}
.site-state.cur{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.site-state.past{color:#5b6b75;background:#eef1f3;border-color:var(--line)}
.proj-details .audit-prog{margin-left:auto}

.barn-status.multi{display:flex;gap:10px;flex-wrap:wrap;padding:0;border:none;background:none}
.barn-status.multi .bs-seg{flex:1 1 340px;padding:11px 16px;border-radius:9px;font-size:14px;border:1px solid}
.bs-seg.s-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.bs-seg.s-bad{background:#fbf3e3;border-color:#e0b36a;color:var(--warn)}
.bs-seg.s-na{background:#f0f2f4;border-color:var(--line);color:var(--muted)}

.ws-empty.small{padding:38px 20px}
.ws-empty.small p{margin:0}

.boot{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.boot-spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:bootspin .9s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
.si-err{font-size:13px;color:var(--bad);background:var(--bad-bg);border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:0 0 6px;line-height:1.45}

/* strip above the dashboard table */
.teambar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--brand-50);border:1px solid #c4d2db;border-radius:10px;padding:8px 14px;margin:0 0 14px;font-size:13px;color:var(--brand-d)}
.teambar.tb-err{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.tb-btn{padding:6px 12px;font-size:12.5px}
.tb-btn:disabled{opacity:.55;cursor:default}

/* "a site with this name already exists" note under the name field on the setup page */
.su-dup{margin:-2px 0 12px;padding:9px 12px;border:1px solid #e0b36a;background:#fbf3e3;border-radius:8px;font-size:12.5px;line-height:1.45;color:#6f520f}
.su-dup[hidden]{display:none}
.su-dup button{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent-700);text-decoration:underline;cursor:pointer}

.sync{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:2px 10px;border:1px solid;white-space:nowrap}
.sync-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.sync-local{color:var(--muted);background:#eef1f3;border-color:var(--line)}
.sync-synced{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.sync-team{color:var(--accent-700);background:#e8f6fd;border-color:var(--accent)}
.sync-ahead,.sync-behind,.sync-removed{color:var(--warn);background:#fbf3e3;border-color:#e0b36a}
.sync-conflict{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.dt-acts .sync-act:disabled{opacity:.55;cursor:default}

.btn.btn-upload:hover{background:var(--accent-700);border-color:var(--accent-700)}

<body>
<div id="app"></div>

<script>
/* =====================================================================
   Library-free .xlsx writer.
   The same approach as exportXlsx in Truss_Evaluation_Form.html: a stored (uncompressed) zip built by hand (crc32 + zipStore) around hand-written SpreadsheetML parts,
   no library. Extended here with real NUMBER cells and number formats (the Truss form only writes text).
   Loaded before core.js (build-personal.ps1, tests/run.js and tests/build-page.js). Plain JS, no DOM, so the tests can run it in Node.

   XLSXW.build(sheets) -> Uint8Array (the .xlsx file)
     sheets: [{ name, cols: [width, ...], rows: [ [cell, ...] | null, ... ] }]
     cell:   null / '' (empty) | string | number | { v: string | number | null, s: style }
             a number is written as a number (<v>), a string as an inline string; a non-finite number is written empty.
     style:  one of XLSXW.S (see below); a plain string or number gets S.TEXT / S.GEN.
   ===================================================================== */
const XLSXW = (function () {
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zipStore(files) {
    const enc = new TextEncoder();
    const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
    const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = f.data, crc = crc32(data);
      const lh = new Uint8Array([].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0)));
      parts.push(lh, name, data);
      central.push({ rec: new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset))), name });
      offset += lh.length + name.length + data.length;
    }
    const cdStart = offset; let cdSize = 0;
    for (const c of central) { parts.push(c.rec, c.name); cdSize += c.rec.length + c.name.length; }
    parts.push(new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length),
      u32(cdSize), u32(cdStart), u16(0))));
    let total = 0; for (const p of parts) total += p.length;
    const out = new Uint8Array(total); let pos = 0;
    for (const p of parts) { out.set(p, pos); pos += p.length; }
    return out;
  }
  const xesc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const enc = new TextEncoder();
  const part = (name, str) => ({ name, data: enc.encode(str) });
  // Excel sheet-name rules: <=31 chars, no \ / ? * [ ] :, unique (case-insensitive)
  function uniqueSheetNames(names) {
    const used = new Set(), out = [];
    names.forEach(raw => {
      let n = (raw || 'Sheet').replace(/[\\\/\?\*\[\]:]/g, '-').replace(/^'+|'+$/g, '').slice(0, 31).trim() || 'Sheet';
      const base = n; let i = 1;
      while (used.has(n.toLowerCase())) { const suf = ' (' + (++i) + ')'; n = base.slice(0, 31 - suf.length) + suf; }
      used.add(n.toLowerCase()); out.push(n);
    });
    return out;
  }

  // style ids = positions in <cellXfs> below
  const S = { DEFAULT: 0, TITLE: 1, HEAD: 2, TEXT: 3, BOLD: 4, INT: 5, DEC1: 6, DEC2: 7, DEC3: 8, GEN: 9, BAD: 10, OK: 11, NA: 12, SECTION: 13, NOTE: 14 };
  const bordered = (numFmt, extra) => '<xf numFmtId="' + numFmt + '" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="top"' + (extra || '') + '/></xf>';
  const filled = fill => '<xf numFmtId="0" fontId="0" fillId="' + fill + '" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>';
  const STYLES_XML =
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
'<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.0"/><numFmt numFmtId="165" formatCode="0.000"/></numFmts>' +
'<fonts count="5"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="12"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF595959"/><name val="Calibri"/></font></fonts>' +
'<fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9E1F2"/><bgColor indexed="64"/></patternFill></fill>' +
'<fill><patternFill patternType="solid"><fgColor rgb="FFF8D7DA"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD4EDDA"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEDEDED"/><bgColor indexed="64"/></patternFill></fill></fills>' +
'<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color indexed="64"/></left><right style="thin"><color indexed="64"/></right><top style="thin"><color indexed="64"/></top><bottom style="thin"><color indexed="64"/></bottom><diagonal/></border></borders>' +
'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
'<cellXfs count="15">' +
'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +                                                                                                                                                      // 0 DEFAULT
'<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +                                                                                                                         // 1 TITLE
'<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>' +                    // 2 HEAD
'<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +                                                              // 3 TEXT
'<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +                                                                                                                         // 4 BOLD
bordered(3) + bordered(164) + bordered(2) + bordered(165) + bordered(0) +                                                                                                                                   // 5 INT (#,##0)  6 DEC1  7 DEC2 (0.00)  8 DEC3 (0.000)  9 GEN
filled(3) + filled(4) + filled(5) +                                                                                                                                                                          // 10 BAD  11 OK  12 NA
'<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +                                                                                                                         // 13 SECTION
'<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +                                                                                                                         // 14 NOTE
'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  const colName = i => { let s = ''; for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };   // 0 -> A, 26 -> AA
  function cellXml(ref, c) {
    let v = c, s = null;
    if (c && typeof c === 'object') { v = c.v; s = c.s != null ? c.s : null; }
    if (typeof v === 'number') {
      if (!isFinite(v)) return s != null ? '<c r="' + ref + '" s="' + s + '"/>' : '';
      return '<c r="' + ref + '" s="' + (s != null ? s : S.GEN) + '"><v>' + String(v) + '</v></c>';
    }
    if (v == null || v === '') return s != null ? '<c r="' + ref + '" s="' + s + '"/>' : '';
    return '<c r="' + ref + '" s="' + (s != null ? s : S.TEXT) + '" t="inlineStr"><is><t xml:space="preserve">' + xesc(v) + '</t></is></c>';
  }
  function sheetXml(sh) {
    const rowsXml = [];
    (sh.rows || []).forEach((row, r) => {
      if (!row) return;
      const cells = row.map((c, i) => cellXml(colName(i) + (r + 1), c)).join('');
      if (cells) rowsXml.push('<row r="' + (r + 1) + '">' + cells + '</row>');
    });
    const cols = (sh.cols || []).map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' + (cols ? '<cols>' + cols + '</cols>' : '') + '<sheetData>' + rowsXml.join('') + '</sheetData></worksheet>';
  }
  function build(sheets) {
    const names = uniqueSheetNames(sheets.map(s => s.name)), files = [];
    sheets.forEach((sh, i) => files.push(part('xl/worksheets/sheet' + (i + 1) + '.xml', sheetXml(sh))));
    files.push(part('xl/styles.xml', STYLES_XML));
    files.push(part('xl/workbook.xml',
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>' +
      sheets.map((sh, i) => '<sheet name="' + xesc(names[i]) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>'));
    files.push(part('xl/_rels/workbook.xml.rels',
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((sh, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'));
    files.push(part('[Content_Types].xml',
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((sh, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>'));
    files.push(part('_rels/.rels',
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'));
    return zipStore(files);
  }
  return { build, S, crc32, zipStore, uniqueSheetNames, colName, xesc };
})();

/* =====================================================================
   Ventilation Calculator — shared core (multi-barn,
   multiple instances per barn type). The data placeholder on the VENT_DATA line
   below is replaced with the extracted workbook data by the build scripts to
   produce standalone HTML.
   ===================================================================== */

  /* ---- Excel export ----
     One workbook per site: a Summary sheet (every barn and scenario) and one sheet per barn (equipment rows, capacity-vs-requirement checks, design assumptions).
     It reads the same results the report is built from (evalScenario / assess / rowNotes) and does no arithmetic of its own, so the two cannot disagree; tests/cases.js
     diffs the workbook against the rendered report for the built-in sample barns.
     A number the report PRINTS is exported as that number: rep(x, d) is fmt(x, d) read back as a number, so "151,596" in the report is 151596 in the cell (a real number,
     with a display format). Numbers the report does not print (CFM per row, capacities, requirements) are exported at full precision with a display format.
     XLSXW (app/_src/xlsx.js) writes the file. */
  function exportModel(config, meta) {

    const R = (x, d) => ({ v: rep(x, d), s: DEC[d] }), raw = (x, style) => ({ v: (x == null || !isFinite(x)) ? null : x, s: style }), T = v => ({ v: v == null ? '' : String(v), s: S.TEXT });

    const verdictCell = (a, lang) => ({ v: verdictText(a, lang), s: a.incomplete ? S.NA : a.issues.length ? S.BAD : S.OK });
    const modeText = p => (p.mode === 'calc' ? 'calculated' : 'entered') + (p.fallback ? '; no soffit / inlet path recorded, so the tunnel pressure is used' : '');
    const chkText = c => (c.cap > 0 && c.ref > 0) ? (c.ok ? 'Sufficient' : 'Insufficient') : (c.cap > 0 ? '—' : 'none');
    const CATS = [['fan', 'Fans'], ['inlet', 'Inlets'], ['inletFilter', 'Inlet Filters'], ['coolCell', 'Cool Cells'], ['filter', 'Filter Bank'], ['soffit', 'Soffit'], ['shutter', 'Shutter']];

/* =================== TEAM (shared library) =================== */
  // With the team layer on (app/team-config.json), people sign in with their JEG Microsoft account and sites they UPLOAD show up on everyone's
  // dashboard. Recording stays local-first (works with no signal); uploading is an explicit button. Anyone on the team can edit; a site's eTag
  // stops two people silently overwriting each other (see conflictDialog). With the layer off, none of this runs.
  let teamRows = [], teamStamp = 0, teamErr = null, teamLoaded = false, teamBusy = false;
  const teamOn = () => !!(TEAM.enabled && store && store.user && store.user.team && TEAM.client());
  const personOf = p => (p && (p.name || p.email)) || 'someone';
  const when = ts => { try { return new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
  const teamEntry = id => teamRows.find(e => e.id === id);
  const dirty = s => !s.remote || s.updatedAt !== s.remote.syncedUpdatedAt;
  const summarizeSite = s => { try { return s && s.config ? VENT.summarize(s.config, siteType(s) === 'proposed' ? 'proposed' : 'existing').counts : null; } catch (e) { return null; } };
  const errText = e => (e && e.message) || 'Something went wrong.';
  const idbId = ref => ref.slice(4);
  const getLocalPhoto = ref => new Promise(res => VENT.photos.get(ref, d => res(d || null)));

  // duplicate-name warning: the sites already on the team (team mode) and on this device, as candidates for VENT.findDuplicateSite
  const dupCandidates = () => (teamOn() ? teamRows.map(e => ({ id: e.id, name: e.name, type: e.type, where: 'team', by: e.modifiedBy ? personOf(e.modifiedBy) : '', at: e.modifiedAt, entry: e })) : [])
    .concat(store.sites.filter(x => !x.setup).map(x => ({ id: x.id, name: x.name, type: siteType(x), where: 'device' })));
  const findDup = (site, name, type) => VENT.findDuplicateSite({ id: site.id, name: name != null ? name : site.name, type: type || siteType(site) }, dupCandidates());
  const dupText = (d, name) => 'There is already ' + (d.type === 'proposed' ? 'a proposed' : 'an existing') + ' site named “' + (d.name || name || 'Untitled') + '” ' +
    (d.where === 'team' ? 'on the team' + (d.by || d.at ? ' (uploaded by ' + (d.by || 'someone') + (d.at ? ', ' + when(d.at) : '') + ')' : '') : 'on this device') + '.';
  // open the existing site; a team site that isn't on this device yet is fetched first (one that is already here is opened as it is — never overwritten)
  const openDup = d => { if (d.where === 'team' && !store.sites.some(x => x.id === d.id)) open(pseudo(d.entry)); else { store.activeId = d.id; save(); route(); } };

  async function refreshTeam() {
    if (!teamOn() || teamBusy) return;
    teamBusy = true; teamErr = null;
    try { teamRows = await TEAM.refresh(summarizeSite); teamStamp = Date.now(); teamLoaded = true; }
    catch (e) { teamErr = e; }
    teamBusy = false;
  }
  // a quick "is there a newer copy?" check for one site (used when a site is opened)
  async function peekRemote(site) {
    if (!teamOn() || !site.remote) return;
    try { const it = await TEAM.client().item(site.id); let e = teamEntry(site.id); if (!e) { e = { id: site.id, name: site.name }; teamRows.push(e); } e.eTag = it.eTag; e.modifiedAt = it.modifiedAt; e.modifiedBy = it.modifiedBy; teamLoaded = true; }
    catch (e) { if (e.code === 'missing') { teamRows = teamRows.filter(x => x.id !== site.id); teamLoaded = true; } }
  }

  // one line describing where a site stands against the team library
  function syncInfo(s, e) {
    if (!TEAM.enabled) return null;
    const by = e && e.modifiedBy ? personOf(e.modifiedBy) : '';
    if (s._teamOnly) return { k: 'team', label: 'On the team', sub: by ? 'by ' + by : '' };
    if (!s.remote) return { k: 'local', label: 'This device only', sub: '' };
    const d = dirty(s);
    if (!e) return teamLoaded ? { k: 'removed', label: 'Not on the team any more', sub: d ? '' : 'upload to share again' } : (d ? { k: 'ahead', label: 'Changes not uploaded', sub: '' } : { k: 'synced', label: 'Shared', sub: '' });
    const newer = e.eTag && e.eTag !== s.remote.eTag;
    if (newer && d) return { k: 'conflict', label: 'Both changed', sub: 'by ' + by };
    if (newer) return { k: 'behind', label: 'Newer on the team', sub: 'by ' + by };
    if (d) return { k: 'ahead', label: 'Changes not uploaded', sub: '' };
    return { k: 'synced', label: 'Shared · up to date', sub: by ? 'last by ' + by : '' };
  }
  const syncChipHtml = sy => sy ? '<span class="sync sync-' + sy.k + '">' + sy.label + '</span>' + (sy.sub ? '<span class="sync-sub"></span>' : '') : '';

  /* ---- a small modal (plain text only) ---- */
  function modal(title, paras, buttons) {
    const ov = el('div', 'modal-ov'), box = el('div', 'modal'); box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
    box.appendChild(el('h2', 'modal-t', title)); (paras || []).forEach(p => box.appendChild(el('p', 'modal-p', p)));
    const row = el('div', 'modal-btns'); const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    (buttons || []).forEach(b => { const x = el('button', 'btn-' + (b.kind || 'ghost'), b.label); x.type = 'button'; x.addEventListener('click', () => { close(); if (b.run) b.run(); }); row.appendChild(x); });
    box.appendChild(row); ov.appendChild(box); ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.addEventListener('keydown', onKey); document.body.appendChild(ov);
    const first = row.querySelector('button'); if (first) first.focus();
  }

  /* ---- upload / download ---- */
  async function uploadSite(s) {
    const c = TEAM.client(); if (!c) throw new Error('Not signed in.');
    if (s.setup || !s.config) throw new Error('Finish setting this site up before uploading it.');
    const have = new Set((s.remote && s.remote.photos) || []);
    for (const ref of VENT.photos.refs(s.config)) {   // photos are separate files, uploaded once each
      if (have.has(ref)) continue;
      const data = await getLocalPhoto(ref);
      if (data) { await c.putPhoto(s.id, idbId(ref), data); have.add(ref); }
    }
    const owner = s.owner || { name: store.user.name || '', email: store.user.email || '' };
    const payload = { v: 1, id: s.id, name: s.name, client: s.client, jobNo: s.jobNo, date: s.date, preparedBy: s.preparedBy, type: siteType(s), status: s.status || 'current', completedAt: s.completedAt || 0, createdAt: s.createdAt, updatedAt: s.updatedAt, owner, editor: { name: store.user.name || '', email: store.user.email || '' }, config: s.config };
    const m = await c.put(payload, s.remote ? s.remote.eTag : null);
    s.owner = owner; s.remote = { eTag: m.eTag, syncedUpdatedAt: s.updatedAt, syncedAt: Date.now(), photos: Array.from(have) }; save();
    const e = teamEntry(s.id) || (teamRows.push({ id: s.id }), teamRows[teamRows.length - 1]);
    Object.assign(e, { eTag: m.eTag, name: s.name, client: s.client, jobNo: s.jobNo, type: siteType(s), status: s.status, completedAt: s.completedAt || 0, updatedAt: s.updatedAt, owner, counts: summarizeSite(s), modifiedAt: m.modifiedAt, modifiedBy: m.modifiedBy });
    return m;
  }
  async function pullSite(id, known) {
    const c = TEAM.client(), g = await c.get(id, known), site = g.site || {}, refs = VENT.photos.refs(site.config);
    for (const ref of refs) { if (!(await getLocalPhoto(ref))) { const d = await c.getPhoto(id, idbId(ref)); if (d) await VENT.photos.put(ref, d); } }
    delete site.setup;
    const local = Object.assign({}, site, { id, remote: { eTag: g.eTag, syncedUpdatedAt: site.updatedAt, syncedAt: Date.now(), photos: refs } });
    const i = store.sites.findIndex(x => x.id === id); if (i >= 0) store.sites[i] = local; else store.sites.push(local);
    save(); return local;
  }
  // upload with the friendly handling of the ways it can go wrong; done() runs afterwards either way
  async function syncUp(s, done, skipDupCheck) {
    const fin = () => { if (done) done(); };
    if (!s.remote && !skipDupCheck) {   // first upload of this site: is the same site already on the team? (a site recorded with no signal is only caught here)
      if (!teamLoaded || Date.now() - teamStamp > 30000) await refreshTeam();
      const d = findDup(s);
      if (d && d.where === 'team') return modal('This site may already be on the team', [dupText(d, s.name), 'If it is the same site, open the team’s copy so there is only one — your copy stays on this device. If it is a different site, give it a different name first, or upload it anyway.'], [
        { label: 'Open the team’s copy', kind: 'primary', run: () => openDup(d) }, { label: 'Upload anyway', run: () => syncUp(s, done, true) }, { label: 'Cancel', run: fin }]);
    }
    try { await uploadSite(s); toast('Uploaded “' + (s.name || 'Untitled') + '” — the team can see it now.'); fin(); }
    catch (e) {
      if (e.code === 'conflict') return conflictDialog(s, done);
      if (e.code === 'gone') return modal('This site was deleted from the team', ['Someone removed “' + (s.name || 'Untitled') + '” from the team library after you last synced. Your copy on this device is untouched.'], [
        { label: 'Upload it again', kind: 'primary', run: () => { s.remote = null; save(); syncUp(s, done); } }, { label: 'Keep it on this device only', run: fin }]);
      toast(errText(e)); fin();
    }
  }
  async function conflictDialog(s, done) {
    const fin = () => { if (done) done(); };
    let latest; try { latest = await TEAM.client().item(s.id); } catch (e) { if (e.code === 'missing') { s.remote = null; save(); return syncUp(s, done); } toast(errText(e)); return fin(); }
    const by = personOf(latest.modifiedBy), at = when(latest.modifiedAt);
    modal('Someone else changed this site', [by + ' uploaded changes at ' + at + ', and you also have changes on this device. Which version should the team have?'], [
      { label: 'Keep mine', kind: 'primary', run: async () => { s.remote = Object.assign({}, s.remote, { eTag: latest.eTag }); try { await uploadSite(s); toast('Uploaded — your version replaced ' + by + '’s.'); } catch (e) { toast(errText(e)); } fin(); } },
      { label: 'Take theirs', run: async () => { if (!confirm('Replace your copy on this device with ' + by + '’s? Your changes to this site will be lost.')) return fin(); try { await pullSite(s.id); toast('Got ' + by + '’s version.'); } catch (e) { toast(errText(e)); } route(); } },
      { label: 'Keep both', run: async () => { const copy = JSON.parse(JSON.stringify(s)); copy.id = uid(); copy.name = (s.name || 'Untitled') + ' (my version)'; delete copy.remote; copy.updatedAt = Date.now(); copy.createdAt = Date.now(); store.sites.push(copy); try { await pullSite(s.id); toast('Kept both — yours is saved as “' + copy.name + '”.'); } catch (e) { toast(errText(e)); } route(); } },
      { label: 'Cancel', run: fin }]);
  }
  function deleteShared(s) {
    const name = s.name || 'Untitled', btns = [];
    if (!s._teamOnly) btns.push({ label: 'Remove from this device only', run: () => { store.sites = store.sites.filter(x => x.id !== s.id); if (store.activeId === s.id) store.activeId = null; save(); route(); } });
    btns.push({ label: 'Delete for everyone', kind: 'danger', run: async () => {
      try { await TEAM.client().remove(s.id, (s.remote && s.remote.eTag) || (teamEntry(s.id) || {}).eTag || null); store.sites = store.sites.filter(x => x.id !== s.id); teamRows = teamRows.filter(x => x.id !== s.id); if (store.activeId === s.id) store.activeId = null; save(); toast('Deleted “' + name + '” from the team library.'); }
      catch (e) { toast(e.code === 'conflict' ? 'Someone changed this site since you last synced — open it and check before deleting.' : errText(e)); }
      route(); } });

    modal('Delete “' + name + '”?', ['This site is on the team library, so other people can see it. “Delete for everyone” removes it for the whole team (' + TEAM.labels.recycle + '). “Remove from this device only” leaves it on the team.'], btns);

  /* ---- the strip above the dashboard table ---- */

  /* =================== DASHBOARD =================== */

  const EMPTY_COUNTS = { total: 0, ok: 0, bad: 0, incomplete: 0, repairs: 0, needRepair: 0 };
  const countsOf = s => s._teamOnly ? Object.assign({}, EMPTY_COUNTS, s._counts || {}) : sumOf(s);

    root.appendChild(main);

    function drawTabs() {
      tabBar.innerHTML = '';
      TABS.forEach(([k, label]) => {
        const n = allRows().filter(r => inTab(r.s, k)).length;
        const b = el('button', 'dtab' + (k === store.tab ? ' active' : '')); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', k === store.tab ? 'true' : 'false');

      const list = allRows().filter(r => inTab(r.s, store.tab));

      kpiWrap.innerHTML = '<div class="kpis">' +
        '<div class="kpi"><span class="k-n">' + list.length + '</span><span class="k-l">Sites</span></div>' +
        '<div class="kpi"><span class="k-n">' + tBarns + '</span><span class="k-l">Barns</span></div>' +
        '<div class="kpi' + (tBad ? ' k-bad' : '') + '"><span class="k-n">' + tBad + '</span><span class="k-l">Need attention</span></div>' +
        '<div class="kpi' + (tRep ? ' k-warn' : '') + '"><span class="k-n">' + tRep + '</span><span class="k-l">Repairs flagged</span></div>' +
        '</div>';
    }
    function drawTable() {
      // active work on top (newest edit first); completed sites below, newest completion first
      const stamp = s => isPast(s) ? (s.completedAt || s.updatedAt || 0) : (s.updatedAt || 0);
      const rows = allRows().filter(r => inTab(r.s, store.tab)).map(r => ({ s: r.s, e: r.e, c: countsOf(r.s), sy: syncInfo(r.s, r.e) })).sort((a, b) => (isPast(a.s) - isPast(b.s)) || (stamp(b.s) - stamp(a.s)));

        if (team && !store.sites.length && !teamRows.length) {
          const empty = el('div', 'ws-empty'); empty.innerHTML = '<div class="we-icon">🏠</div><p>' + (teamBusy ? 'Checking the team library…' : 'No sites yet — yours or the team’s.') + '</p>';
          const b = el('button', 'btn-primary', '+ Create your first site'); b.addEventListener('click', newSite);

          empty.appendChild(b); empty.appendChild(s); tableWrap.appendChild(empty); return;
        }

      tbl.innerHTML = '<thead><tr><th>Site</th><th>Type</th><th>Client</th><th>Status</th><th>Barns</th>' + (team ? '<th>Team</th>' : '') + '<th>Updated</th><th></th></tr></thead>';
      const tb = el('tbody');
      rows.forEach(({ s, e, c, sy }) => {
        const tr = el('tr', isPast(s) ? 'is-past' : '');
        tr.innerHTML = '<td class="dt-name">' + statusDot(c) + '<b></b>' + (isPast(s) ? ' <span class="draft is-past">completed</span>' : '') + '</td>' +
          '<td>' + typeBadge(s) + '</td><td class="dt-client"></td><td>' + statusPills(s, c) + '</td><td>' + c.total + '</td>' + (team ? '<td class="dt-team">' + syncChipHtml(sy) + '</td>' : '') + '<td>' + (isPast(s) ? 'Completed ' + fmtDate(stamp(s)) : fmtDate(s.updatedAt)) + '</td><td class="dt-act"></td>';
        tr.querySelector('.dt-name b').textContent = s.name || 'Untitled';
        tr.querySelector('.dt-client').textContent = s.client || '—';
        if (team && sy && sy.sub) { const sub = tr.querySelector('.sync-sub'); if (sub) sub.textContent = sy.sub; }
        const act = tr.querySelector('.dt-act'), btns = [];
        const bOpen = el('button', 'btn-icon open', 'Open →'); bOpen.addEventListener('click', () => open(s)); btns.push(bOpen);
        if (team && sy) {
          const sb = (label, title, fn) => { const b = el('button', 'btn-icon sync-act', label); b.title = title; b.addEventListener('click', () => { b.disabled = true; fn(b); }); btns.push(b); };
          if (sy.k === 'local' || sy.k === 'ahead' || sy.k === 'removed') sb('⤒ Upload', 'Share this site with the team', b => { b.textContent = 'Uploading…'; if (sy.k === 'removed') { s.remote = null; save(); } syncUp(s, () => route()); });
          if (sy.k === 'behind') sb('⤓ Get latest', 'Bring the newer team version onto this device', b => { b.textContent = 'Getting…'; pullSite(s.id).then(() => { toast('Got the latest version of “' + (s.name || 'Untitled') + '”.'); route(); }).catch(er => { toast(errText(er)); route(); }); });
          if (sy.k === 'conflict') sb('Resolve…', 'You and someone else both changed this site', () => conflictDialog(s, () => route()));
        }
        if (!s._teamOnly) {
          const bState = el('button', 'btn-icon', isPast(s) ? 'Reopen' : 'Mark complete'); bState.title = isPast(s) ? 'Move this site back to Current sites to keep working on it' : 'Finished — move to Past sites (kept for reference)'; bState.addEventListener('click', () => { const done = !isPast(s); setPast(s, done); toast(done ? '“' + (s.name || 'Untitled') + '” marked complete — kept under Past sites.' + (team ? ' Upload it so the team sees that.' : '') : '“' + (s.name || 'Untitled') + '” reopened — back in Current sites.'); });
          const bDup = el('button', 'btn-icon', 'Duplicate'); bDup.addEventListener('click', () => duplicateSite(s));
          btns.push(bState, bDup);
        }
        const bDel = el('button', 'btn-icon danger', 'Delete'); bDel.addEventListener('click', () => deleteSite(s)); btns.push(bDel);
        const grid = el('div', 'dt-acts'); btns.forEach(b => grid.appendChild(b)); act.appendChild(grid);   // two buttons per line, so the Team column doesn't push the table sideways
        tr.addEventListener('click', e2 => { if (!e2.target.closest('button')) open(s); });
        tb.appendChild(tr);
      });
      tbl.appendChild(tb); tableWrap.appendChild(tbl);
    }
    redraw();
  }

  function open(site) {
    if (site._teamOnly) { toast('Getting “' + (site.name || 'Untitled') + '” from the team library…'); pullSite(site.id).then(l => { store.activeId = l.id; save(); route(); }).catch(e => toast(errText(e))); return; }
    store.activeId = site.id; save(); route();
  }
  function newSite() {
    const s = { id: uid(), name: '', client: '', jobNo: '', type: 'existing', status: 'current', createdAt: Date.now(), updatedAt: Date.now(), config: null, setup: true };
    store.sites.push(s); open(s);
  }
  function newSampleSite() {
    const s = { id: uid(), name: 'Sample Site', client: 'Example data', jobNo: '', date: longToday(), preparedBy: store.user.name || store.user.email, type: 'existing', status: 'current', createdAt: Date.now(), updatedAt: Date.now(), config: VENT.sampleSnapshot() };

  function setPast(s, past) {

  }

  /* =================== SITE SETUP =================== */
  function renderSiteSetup(site) {
    const cancel = () => { if (site.setup && !site.config) store.sites = store.sites.filter(x => x.id !== site.id); store.activeId = null; save(); route(); };
    root.appendChild(topNav({ back: 'Dashboard', onBack: cancel }));

    const wrap = el('div', 'setup-wrap');
    const card = el('div', 'setup-card');
    card.appendChild(el('h1', 'setup-title', 'Set up site'));
    card.appendChild(el('p', 'setup-sub', 'Pick the kind of site, add a few details, and set the barns you’ll be working on. You can add or remove barns any time.'));

    // Existing vs Proposed
    let type = siteType(site), paintDup = () => {};
    card.appendChild(el('p', 'su-q', 'What kind of site is this?'));
    const typeRow = el('div', 'su-types'); typeRow.setAttribute('role', 'radiogroup');

    const goOpen = d => { if (site.setup && !site.config) store.sites = store.sites.filter(x => x.id !== site.id); save(); openDup(d); };
    paintDup = () => {
      const d = findDup(site, inName.value, type); dupNote.hidden = !d; dupNote.textContent = ''; if (!d) return;
      dupNote.appendChild(document.createTextNode(dupText(d, inName.value.trim()) + ' If it’s the same site, open it instead of starting a second one. '));
      const o = el('button', '', 'Open it'); o.type = 'button'; o.addEventListener('click', () => goOpen(d)); dupNote.appendChild(o);
    };
    inName.addEventListener('input', paintDup);
    const inClient = mk('Client / producer', site.client, 'Owner or producer');
    const inJob = mk('Job No.', site.jobNo, 'e.g. 0084');
    const inDate = mk('Date', site.date || longToday());

    card.appendChild(fields);

    card.appendChild(el('h2', 'setup-h2', 'Barns on this site'));

    const counts = {};
    const types = (VENT.data && VENT.data.meta && VENT.data.meta.barns) || [];
    const totalEl = el('span', 'su-total', '0 barns');

    });
    actions.appendChild(cancelBtn); actions.appendChild(start);
    card.appendChild(actions);
    wrap.appendChild(card); root.appendChild(wrap);
    setTimeout(() => inName.focus(), 30);
