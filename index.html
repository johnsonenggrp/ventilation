  /* =================== SITE (the calculator) =================== */
  function renderSite(site) {
    let changed = false;
    if (!site.date) { site.date = longToday(); changed = true; }
    if (!site.preparedBy) { site.preparedBy = (store.user && store.user.email) || ''; changed = true; }
    if (site.jobNo == null) { site.jobNo = ''; changed = true; }
    if (!site.type) { site.type = 'existing'; changed = true; }
    if (!site.status) { site.status = 'current'; changed = true; }
    if (changed) save();
    const proposedSite = siteType(site) === 'proposed';

    const nameInput = el('input', 'proj-name-input'); nameInput.value = site.name; nameInput.title = 'Site name';
    nameInput.addEventListener('change', () => { site.name = nameInput.value.trim() || site.name; site.updatedAt = Date.now(); save(); paintSync(); const d = findDup(site); if (d) toast(dupText(d, site.name) + ' Two sites with the same name are easy to mix up.'); });
    const printArea = el('div'); printArea.id = 'printArea';
    const meta = () => ({ project: site.name, client: site.client, jobNo: site.jobNo, date: site.date, preparedBy: site.preparedBy, byLabel: 'Prepared by', siteType: siteType(site), perBarnFactor: true });
    const bReport = el('button', 'btn btn-report', '🖨 Report / PDF'); bReport.title = 'Preview / save the report as a PDF'; bReport.addEventListener('click', () => { if (ventApi) ventApi.buildReport(printArea, meta(), () => window.print()); });
    const bState = el('button', 'btn', isPast(site) ? '↺ Reopen site' : '✓ Mark complete'); bState.title = isPast(site) ? 'Move this site back to Current sites to keep working on it' : 'Finished — move to Past sites (kept for reference)';
    bState.addEventListener('click', () => { const done = !isPast(site); setPast(site, done); toast(done ? 'Marked complete — kept under Past sites for reference.' : 'Reopened — back in Current sites.'); });
    const bSave = el('button', 'btn', '⤓ Export'); bSave.addEventListener('click', () => ventApi && ventApi.exportConfig());
    const bXlsx = el('button', 'btn btn-xlsx', '📊 Export to Excel'); bXlsx.title = 'Download this site as an Excel workbook: a Summary sheet plus one sheet per barn';
    bXlsx.addEventListener('click', () => {
      if (!ventApi) return;
      let x; try { x = VENT.exportXlsx(ventApi.snapshot(), meta()); } catch (e) { toast('Couldn’t make the Excel file: ' + (e && e.message || e)); return; }
      shareOrDownload(x.filename, new Blob([x.bytes], { type: x.mime }), x.mime).then(how => { if (how !== 'abort') toast((how === 'shared' ? 'Shared ' : 'Exported ') + x.filename); }).catch(e => toast('Couldn’t save the Excel file: ' + (e && e.message || e)));
    });
    const bLoad = el('button', 'btn', '⤒ Import'); const fileIn = el('input'); fileIn.type = 'file'; fileIn.accept = '.json,application/json'; fileIn.style.display = 'none';
    bLoad.addEventListener('click', () => fileIn.click());
    fileIn.addEventListener('change', e => { if (e.target.files[0] && ventApi) ventApi.importConfig(e.target.files[0]); fileIn.value = ''; });
    const bReset = el('button', 'btn danger', '↺ Reset'); bReset.addEventListener('click', () => ventApi && ventApi.resetConfig());
    const teamSite = teamOn(); let bUp = null;
    if (teamSite) { bUp = el('button', 'btn btn-upload', '⤒ Upload to team'); bUp.title = 'Share this site with the team'; bUp.addEventListener('click', () => { bUp.disabled = true; bUp.textContent = 'Uploading…'; syncUp(site, () => { bUp.disabled = false; bUp.textContent = '⤒ Upload to team'; paintSync(); }); }); }

    root.appendChild(topNav({ back: 'Dashboard', leftEls: [nameInput], rightEls: (bUp ? [bUp] : []).concat([bReport, bXlsx, bState, bSave, bLoad, bReset, fileIn]) }));

    const details = el('div', 'proj-details');
    const field = (label, val, on, hint) => { const w = el('label', 'pd-field'); w.appendChild(el('span', 'pd-l', label)); const i = el('input', 'pd-in'); i.value = val || ''; if (hint) i.placeholder = hint; i.addEventListener('input', () => { on(i.value); site.updatedAt = Date.now(); save(); paintSync(); }); w.appendChild(i); return w; };
    details.appendChild(field('Client', site.client, v => site.client = v, 'Producer / owner'));
    details.appendChild(field('Job No.', site.jobNo, v => site.jobNo = v, 'e.g. 0084'));
    details.appendChild(field('Date', site.date, v => site.date = v));
    details.appendChild(field('Prepared by', site.preparedBy, v => site.preparedBy = v));
    // site type can be changed after setup too — re-render so the scenario order, labels and verdicts follow
    const tw = el('label', 'pd-field'); tw.appendChild(el('span', 'pd-l', 'Site type'));
    const typeSel = el('select', 'pd-sel');
    [['existing', 'Existing site'], ['proposed', 'Proposed site']].forEach(([k, l]) => { const o = el('option', null, l); o.value = k; if (k === siteType(site)) o.selected = true; typeSel.appendChild(o); });
    typeSel.addEventListener('change', () => { site.type = typeSel.value; site.updatedAt = Date.now(); save(); route(); });
    tw.appendChild(typeSel); details.appendChild(tw);
    details.appendChild(el('div', 'site-state ' + (isPast(site) ? 'past' : 'cur'), isPast(site) ? 'Completed' + (site.completedAt ? ' ' + fmtDate(site.completedAt) : '') : 'In progress'));
    const progChip = el('div', 'audit-prog');
    const updateProg = () => { const p = siteProgress(site); progChip.className = 'audit-prog' + (p.total && p.complete === p.total ? ' done' : (p.total ? ' warn' : '')); progChip.innerHTML = p.total ? ('<b>' + p.complete + '</b> of <b>' + p.total + '</b> barns ' + (proposedSite ? 'designed' : 'recorded')) : 'No barns yet'; };
    details.appendChild(progChip);
    const syncEl = el('div', 'sync-line'), banner = el('div', 'sync-banner');
    const paintSync = () => {
      if (!teamSite) return;
      const sy = syncInfo(site, teamEntry(site.id)); syncEl.innerHTML = syncChipHtml(sy); const sub = syncEl.querySelector('.sync-sub'); if (sub && sy.sub) sub.textContent = sy.sub;
      banner.innerHTML = ''; banner.style.display = 'none';
      if (sy.k === 'behind' || sy.k === 'conflict') {
        banner.style.display = '';
        const e = teamEntry(site.id), by = e && e.modifiedBy ? personOf(e.modifiedBy) : 'Someone';
        banner.appendChild(el('span', 'sb-t', sy.k === 'behind' ? by + ' uploaded a newer version of this site.' : by + ' uploaded changes, and you have changes too.'));
        const b = el('button', 'btn-primary', sy.k === 'behind' ? '⤓ Get latest' : 'Resolve…');
        b.addEventListener('click', () => { if (sy.k === 'behind') { pullSite(site.id).then(() => { toast('Got the latest version.'); route(); }).catch(er => toast(errText(er))); } else conflictDialog(site, () => route()); });
        banner.appendChild(b);
      }
    };
    if (teamSite) details.appendChild(syncEl);
    root.appendChild(details); root.appendChild(banner);
    paintSync(); if (teamSite) peekRemote(site).then(paintSync);

    const intro = el('div', 'mgr-intro' + (isPast(site) ? ' is-complete' : ''));
    intro.innerHTML = isPast(site)
      ? '<b>Completed site</b> — kept here for reference so you can look back at how it was done. Anything you change below still saves; use <b>↺ Reopen site</b> to move it back to Current sites if you’re picking the work up again.'
      : proposedSite
      ? 'Enter the building, then specify the <b>Proposed Design</b> — or hit <b>✨ Recommend sizing</b> to auto-size it and edit from there. <b>Existing</b> is optional, for comparing against what’s there today.'
      : 'Record what’s installed under <b>Existing</b>, then build the <b>Proposed Remodel</b> — or hit <b>✨ Recommend sizing</b> to auto-size it and edit from there. Fan factor (set per barn) and static pressure are yours to tune.';
    root.appendChild(intro);

    const host = el('div'); root.appendChild(host);
    let opened = false;   // the calculator reports its state once as it opens; that report is the starting point, not an edit
    ventApi = VENT.mount(host, {
      layout: 'hybrid', manage: true, embedded: true, initialConfig: site.config, startEmpty: !site.config,
      scenarios: proposedSite ? ['proposed', 'existing'] : ['existing', 'proposed'],   // lead with the side you're working on
      engineering: true, perBarnFactor: true, recommend: true, dualStatus: true,
      labels: { proposed: proposedSite ? 'Proposed Design' : 'Proposed Remodel' },
      onChange: snap => {
        // the calculator reports its state when it opens as well as when something changes — only a real change counts as an edit (otherwise just
        // opening a site would mark it "changes not uploaded" and bump its date). The opening report is not compared: the calculator fills in defaults and blank
        // rows as it opens, so it never equals what was stored. Every later report is a copy of the editor's state and is compared with the one before it.
        const first = !opened; opened = true;
        const same = !!site.config && (first || JSON.stringify(snap) === JSON.stringify(site.config));
        site.config = snap; if (!same) { site.updatedAt = Date.now(); save(); }
        updateProg(); paintSync();
      }
    });
    updateProg();
    root.appendChild(printArea);
  }

  return { mount };
})();

</script>
<script>
SHELL.mount(document.getElementById('app'));
</script>
